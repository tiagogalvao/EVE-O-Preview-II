stages:
  - build
  - upload
  - release
  - cleanup

variables:
  # The name of the zip file generated by the Cake script
  ZIP_FILE: "EVE-O Preview.zip"
  # URL-encoded name for the package registry
  ZIP_FILE_URL: "EVE-O%20Preview.zip"
  # The name used in the GitLab Package Registry
  PACKAGE_NAME: "eve-o-preview"
  # The version is taken from the tag name
  PACKAGE_VERSION: "${CI_COMMIT_TAG}"
  # URL for the generic package
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/${ZIP_FILE_URL}"

build_job:
  stage: build
  script:
    - echo "Starting Build..."
    - dotnet run --project build/Build.csproj -- --target=Zip
  artifacts:
    paths:
      - publish/
    expire_in: 1 week

upload_job:
  stage: upload
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Uploading ${ZIP_FILE} to Package Registry..."
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "publish/${ZIP_FILE}" \
           "${PACKAGE_URL}"

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating GitLab Release for ${CI_COMMIT_TAG}..."
    - |
      release-cli create --name "Release ${CI_COMMIT_TAG}" \
        --description "Automated release from CI/CD pipeline" \
        --tag-name "${CI_COMMIT_TAG}" \
        --assets-link "{\"name\":\"${ZIP_FILE}\",\"url\":\"${PACKAGE_URL}\"}"

cleanup_old_releases:
  stage: cleanup
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      $headers = @{ "JOB-TOKEN" = "$env:CI_JOB_TOKEN" }
      $apiBase = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID"
      Write-Host "Fetching packages for $env:PACKAGE_NAME..."
      $packages = @(Invoke-RestMethod -Headers $headers -Uri "$apiBase/packages?package_type=generic&package_name=$env:PACKAGE_NAME&sort=desc&order_by=created_at")
      if ($packages.Count -gt 3) {
          $toDelete = $packages | Select-Object -Skip 3
          Write-Host "Found $($packages.Count) packages. Deleting $($toDelete.Count) old releases..."
          $toDelete | ForEach-Object {
              $ver = $_.version
              $pkgId = $_.id
              Write-Host "Deleting package version: $ver (ID: $pkgId)"
              try {
                  Invoke-RestMethod -Method Delete -Headers $headers -Uri "$apiBase/packages/$pkgId"
              } catch {
                  Write-Warning "Failed to delete package $pkgId: $($_.Exception.Message)"
              }
              Write-Host "Deleting release for tag: $ver"
              try {
                  Invoke-RestMethod -Method Delete -Headers $headers -Uri "$apiBase/releases/$ver"
              } catch {
                  Write-Host "Release $ver not found or could not be deleted."
              }
          }
      } else {
          Write-Host "Only $($packages.Count) packages found. No cleanup needed."
      }
